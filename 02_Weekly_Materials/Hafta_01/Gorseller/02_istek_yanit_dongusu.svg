<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
<title id="title">Bir isteğin yolculuğu</title><desc id="desc">Zaman yukarıdan aşağıya ilerler. Bu örnekte kitaplar veritabanında saklanır.</desc>
<rect width="1400" height="860" fill="#F5F8FC"/>
<text x="55.0" y="42" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#18334B">Bir isteğin yolculuğu</text>
<text x="55.0" y="101" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#52677B">Zaman yukarıdan aşağıya ilerler. Bu örnekte kitaplar veritabanında saklanır.</text>
<line x1="55" y1="147" x2="1345" y2="147" stroke="#CFDAE6" stroke-width="2"/>
<text x="188.8" y="182" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#176BBA">İstemci</text>
<line x1="240" y1="236" x2="240" y2="690" stroke="#BCCBDA" stroke-width="2"/>
<text x="582.9" y="182" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#176BBA">Sunucu uygulaması</text>
<line x1="720" y1="236" x2="720" y2="690" stroke="#BCCBDA" stroke-width="2"/>
<text x="1107.1" y="182" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#176BBA">Veritabanı</text>
<line x1="1180" y1="236" x2="1180" y2="690" stroke="#BCCBDA" stroke-width="2"/>
<text x="70.0" y="249" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#18334B">1. Kitap seçilir.</text>
<line x1="240" y1="320" x2="720" y2="320" stroke="#176BBA" stroke-width="3"/>
<polygon points="720.0,320.0 707.4,326.1 707.4,313.9" fill="#176BBA"/>
<text x="280.0" y="278" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#176BBA">2. GET /api/kitaplar/42</text>
<rect x="565" y="346" width="310" height="65" rx="16" fill="#E9F3FC" stroke="#CBD8E6" stroke-width="2"/>
<text x="585.0" y="365" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#18334B">3. İstek değerlendirilir.</text>
<line x1="720" y1="457" x2="1180" y2="457" stroke="#176BBA" stroke-width="3"/>
<polygon points="1180.0,457.0 1167.4,463.1 1167.4,450.9" fill="#176BBA"/>
<text x="775.0" y="420" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#176BBA">4. Kitap kaydı sorgulanır.</text>
<line x1="1180" y1="527" x2="720" y2="527" stroke="#087F78" stroke-width="3"/>
<polygon points="720.0,527.0 732.6,520.9 732.6,533.1" fill="#087F78"/>
<text x="865.0" y="490" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#087F78">Kayıt döner.</text>
<line x1="720" y1="600" x2="240" y2="600" stroke="#087F78" stroke-width="3"/>
<polygon points="240.0,600.0 252.6,593.9 252.6,606.1" fill="#087F78"/>
<text x="282.0" y="556" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#087F78">5. Durum + başlıklar + JSON</text>
<rect x="75" y="630" width="350" height="65" rx="16" fill="white" stroke="#CBD8E6" stroke-width="2"/>
<text x="97.0" y="650" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#18334B">6. İstemci yanıtı yorumlar.</text>
<text x="55.0" y="758" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#52677B">Veritabanı her API için zorunlu değildir; sunucu sonucu hesaplayarak da üretebilir.</text>
<text x="55.0" y="808" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#52677B">API Dersi • Hafta 01</text>
</svg>