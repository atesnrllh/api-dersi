<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
<title id="title">Bir API adresini ve işlemini okumak</title><desc id="desc">Metot, URL’nin parçası değildir; istenen işlemin anlamını belirtir.</desc>
<rect width="1400" height="860" fill="#F5F8FC"/>
<text x="55.0" y="42" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#18334B">Bir API adresini ve işlemini okumak</text>
<text x="55.0" y="101" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#52677B">Metot, URL’nin parçası değildir; istenen işlemin anlamını belirtir.</text>
<line x1="55" y1="147" x2="1345" y2="147" stroke="#CFDAE6" stroke-width="2"/>
<rect x="55" y="200" width="1290" height="100" rx="16" fill="#E9F3FC" stroke="#CBD8E6" stroke-width="2"/>
<text x="82.0" y="235" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#176BBA">GET https://kutuphane.example/api/kitaplar/42?dil=tr</text>
<rect x="55" y="332" width="1290" height="62" rx="9" fill="white" stroke="#CBD8E6" stroke-width="2"/>
<text x="77.0" y="350" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#176BBA">GET</text>
<text x="470.0" y="350" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#18334B">Metot</text>
<text x="750.0" y="350" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#18334B">Kaynağın temsilini alma isteği.</text>
<rect x="55" y="404" width="1290" height="62" rx="9" fill="white" stroke="#CBD8E6" stroke-width="2"/>
<text x="77.0" y="422" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#176BBA">https</text>
<text x="470.0" y="422" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#18334B">Şema</text>
<text x="750.0" y="422" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#18334B">TLS ile korunan HTTP iletişimi.</text>
<rect x="55" y="476" width="1290" height="62" rx="9" fill="white" stroke="#CBD8E6" stroke-width="2"/>
<text x="77.0" y="494" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#176BBA">kutuphane.example</text>
<text x="470.0" y="494" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#18334B">Sunucu adı</text>
<text x="750.0" y="494" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#18334B">Öğretim adresi; çalışan hizmet değil.</text>
<rect x="55" y="548" width="1290" height="62" rx="9" fill="white" stroke="#CBD8E6" stroke-width="2"/>
<text x="77.0" y="566" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#176BBA">/api/kitaplar/42</text>
<text x="470.0" y="566" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#18334B">Yol</text>
<text x="750.0" y="566" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#18334B">Bu örnekte 42 numaralı kitap.</text>
<rect x="55" y="620" width="1290" height="62" rx="9" fill="white" stroke="#CBD8E6" stroke-width="2"/>
<text x="77.0" y="638" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#176BBA">dil=tr</text>
<text x="470.0" y="638" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#18334B">Sorgu bileşeni</text>
<text x="750.0" y="638" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#18334B">Bu örnekte Türkçe temsil tercihi.</text>
<text x="55.0" y="758" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#52677B">“?” sorguyu başlatır. Yol ve parametrelerin anlamını örnek API’nin sözleşmesi belirler.</text>
<text x="55.0" y="808" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#52677B">API Dersi • Hafta 01</text>
</svg>