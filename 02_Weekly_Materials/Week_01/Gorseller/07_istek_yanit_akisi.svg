<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1270" viewBox="0 0 1800 1270">
<rect width="1800" height="1270" fill="#F5F7FB"/>
<defs><marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#1D5AD7"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#087E74"/></marker><marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#7A3CB7"/></marker></defs>
<text x="60" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#172B4D" text-anchor="start">Bir istek, dört adım</text>
<text x="60" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#4D5D77" text-anchor="start">client.py ve server.py aynı bilgisayarda, ayrı süreçlerde çalışır.</text>
<rect x="60" y="180" width="700" height="850" rx="22" fill="white" stroke="#D8E0ED" stroke-width="2"/>
<rect x="1000" y="180" width="740" height="850" rx="22" fill="#EBF2FF" stroke="#BFD0F3" stroke-width="2"/>
<text x="92" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#172B4D" text-anchor="start">İstemci süreci · client.py</text>
<text x="1032" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#172B4D" text-anchor="start">Sunucu süreci</text>
<text x="1032" y="273" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#4D5D77" text-anchor="start">Uvicorn ve FastAPI uygulaması (app)</text>
<circle cx="113" cy="308" r="24" fill="#1D5AD7"/>
<text x="113" y="317" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="white" text-anchor="middle">1</text>
<text x="151" y="317" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#172B4D" text-anchor="start">HTTPX isteği gönderir</text>
<rect x="91" y="349" width="638" height="250" rx="14" fill="#F2F5FA" stroke="#D8E0ED" stroke-width="2"/>
<text x="112" y="390" font-family="Consolas, monospace" font-size="23" font-weight="400" fill="#172B4D" text-anchor="start">import httpx</text>
<text x="112" y="429" font-family="Consolas, monospace" font-size="23" font-weight="400" fill="#172B4D" text-anchor="start"></text>
<text x="112" y="468" font-family="Consolas, monospace" font-size="23" font-weight="400" fill="#172B4D" text-anchor="start">response = httpx.get(</text>
<text x="112" y="507" font-family="Consolas, monospace" font-size="23" font-weight="400" fill="#172B4D" text-anchor="start">    &quot;http://127.0.0.1:8000/book/42&quot;</text>
<text x="112" y="546" font-family="Consolas, monospace" font-size="23" font-weight="400" fill="#172B4D" text-anchor="start">)</text>
<line x1="776" y1="401" x2="979" y2="401" stroke="#1D5AD7" stroke-width="5" marker-end="url(#arrow-blue)"/>
<text x="877" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#1D5AD7" text-anchor="middle">HTTP isteği</text>
<text x="877" y="383" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1D5AD7" text-anchor="middle">GET</text>
<rect x="1030" y="305" width="680" height="141" rx="15" fill="white" stroke="#D8E0ED" stroke-width="2"/>
<circle cx="1070" cy="348" r="24" fill="#1D5AD7"/>
<text x="1070" y="357" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="white" text-anchor="middle">2</text>
<text x="1110" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="600" fill="#172B4D" text-anchor="start">Uvicorn isteği alır</text>
<text x="1060" y="407" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#4D5D77" text-anchor="start">İsteği çalışan app uygulamasına iletir.</text>
<line x1="1370" y1="460" x2="1370" y2="510" stroke="#1D5AD7" stroke-width="5" marker-end="url(#arrow-blue)"/>
<rect x="1030" y="529" width="680" height="411" rx="15" fill="white" stroke="#D8E0ED" stroke-width="2"/>
<circle cx="1070" cy="574" r="24" fill="#1D5AD7"/>
<text x="1070" y="583" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="white" text-anchor="middle">3</text>
<text x="1110" y="584" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" fill="#172B4D" text-anchor="start">app, get_book() fonksiyonunu</text>
<text x="1110" y="623" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" fill="#172B4D" text-anchor="start">çalıştırır</text>
<text x="1060" y="671" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#4D5D77" text-anchor="start">server.py içindeki kod:</text>
<text x="1060" y="712" font-family="Consolas, monospace" font-size="23" font-weight="400" fill="#172B4D" text-anchor="start">app = FastAPI()</text>
<text x="1060" y="750" font-family="Consolas, monospace" font-size="23" font-weight="400" fill="#172B4D" text-anchor="start"></text>
<text x="1060" y="788" font-family="Consolas, monospace" font-size="23" font-weight="400" fill="#172B4D" text-anchor="start">@app.get(&quot;/book/42&quot;)</text>
<text x="1060" y="826" font-family="Consolas, monospace" font-size="23" font-weight="400" fill="#172B4D" text-anchor="start">def get_book():</text>
<text x="1060" y="864" font-family="Consolas, monospace" font-size="23" font-weight="400" fill="#172B4D" text-anchor="start">    return {&quot;title&quot;: &quot;API Yolculuğu&quot;}</text>
<text x="1060" y="919" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#4D5D77" text-anchor="start">Sözlük, JSON yanıt gövdesine dönüştürülür.</text>
<line x1="978" y1="823" x2="781" y2="823" stroke="#087E74" stroke-width="5" marker-end="url(#arrow-teal)"/>
<text x="877" y="771" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#087E74" text-anchor="middle">HTTP yanıtı</text>
<text x="877" y="805" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#087E74" text-anchor="middle">200 OK</text>
<circle cx="113" cy="675" r="24" fill="#087E74"/>
<text x="113" y="684" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="white" text-anchor="middle">4</text>
<text x="151" y="685" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#172B4D" text-anchor="start">İstemci yanıtı okur</text>
<text x="92" y="734" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#4D5D77" text-anchor="start">Yanıt gövdesi:</text>
<rect x="91" y="752" width="638" height="67" rx="12" fill="#EAF7F3" stroke="#B8DDD3" stroke-width="2"/>
<text x="112" y="796" font-family="Consolas, monospace" font-size="24" font-weight="400" fill="#087E74" text-anchor="start">{&quot;title&quot;:&quot;API Yolculuğu&quot;}</text>
<text x="111" y="872" font-family="Consolas, monospace" font-size="24" font-weight="400" fill="#172B4D" text-anchor="start">book = response.json()</text>
<text x="111" y="912" font-family="Consolas, monospace" font-size="24" font-weight="400" fill="#172B4D" text-anchor="start">print(book[&quot;title&quot;])</text>
<text x="111" y="983" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" fill="#087E74" text-anchor="start">Ekran çıktısı: API Yolculuğu</text>
<rect x="60" y="1070" width="1680" height="147" rx="22" fill="#FFFFFF" stroke="#D8E0ED" stroke-width="2"/>
<text x="91" y="1115" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" fill="#172B4D" text-anchor="start">API, burada GET /book/42 isteğiyle kitap başlığı alma imkânı ve kullanım kuralıdır.</text>
<text x="91" y="1158" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#4D5D77" text-anchor="start">server.py kodun bulunduğu dosyadır. Uvicorn, app uygulamasını çalıştıran sunucu programıdır.</text>
<text x="91" y="1194" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#4D5D77" text-anchor="start">Ağ üzerinden dosyalar değil, istek ve yanıt mesajları taşınır.</text>
</svg>