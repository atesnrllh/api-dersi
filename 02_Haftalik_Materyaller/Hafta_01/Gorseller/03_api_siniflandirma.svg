<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
<title id="title">API’leri üç ayrı ölçütle tanımlamak</title><desc id="desc">Bu sütunlar alternatif API listeleri değildir; aynı API üçüyle birlikte açıklanabilir.</desc>
<rect width="1400" height="860" fill="#F5F8FC"/>
<text x="55.0" y="42" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#18334B">API’leri üç ayrı ölçütle tanımlamak</text>
<text x="55.0" y="101" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#52677B">Bu sütunlar alternatif API listeleri değildir; aynı API üçüyle birlikte açıklanabilir.</text>
<line x1="55" y1="147" x2="1345" y2="147" stroke="#CFDAE6" stroke-width="2"/>
<rect x="55" y="210" width="410" height="360" rx="16" fill="white" stroke="#CBD8E6" stroke-width="2"/>
<text x="77.0" y="230" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#176BBA">Nerede kullanılır?</text>
<text x="77.0" y="275" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#18334B">Kütüphane API’si</text>
<text x="77.0" y="310" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#18334B">İşletim sistemi API’si</text>
<text x="77.0" y="345" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#18334B">Tarayıcı API’si</text>
<text x="77.0" y="380" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#18334B">Ağ üzerinden web API</text>
<rect x="495" y="210" width="410" height="360" rx="16" fill="white" stroke="#CBD8E6" stroke-width="2"/>
<text x="517.0" y="230" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#176BBA">Kimler kullanır?</text>
<text x="517.0" y="275" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#18334B">Kurum içi / özel</text>
<text x="517.0" y="310" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#18334B">İş ortağı</text>
<text x="517.0" y="345" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#18334B">Dış geliştiricilere açık</text>
<rect x="935" y="210" width="410" height="360" rx="16" fill="white" stroke="#CBD8E6" stroke-width="2"/>
<text x="957.0" y="230" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#176BBA">Yaklaşım nedir?</text>
<text x="957.0" y="275" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#18334B">REST: mimari stil</text>
<text x="957.0" y="310" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#18334B">SOAP: mesajlaşma protokolü</text>
<text x="957.0" y="345" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#18334B">GraphQL: sorgu dili ve</text>
<text x="957.0" y="380" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#18334B">yürütme sistemi</text>
<rect x="55" y="610" width="1290" height="96" rx="16" fill="#E6F4F1" stroke="#97CFC6" stroke-width="2"/>
<text x="85.0" y="631" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#087F78">Örnek: Üniversitenin kitap hizmeti</text>
<text x="85.0" y="670" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#18334B">Web API + kurum içi erişim + REST yaklaşımı</text>
<text x="55.0" y="758" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#52677B">Dış geliştiricilere açık olması; ücretsiz, kimliksiz veya açık kaynak olması demek değildir.</text>
<text x="55.0" y="808" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#52677B">API Dersi • Hafta 01</text>
</svg>