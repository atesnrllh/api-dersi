<text x="367.0" y="670" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#18334B">Mobil uygulama ve web sitesi aynı API işlemlerini kullanabilir.</text>
