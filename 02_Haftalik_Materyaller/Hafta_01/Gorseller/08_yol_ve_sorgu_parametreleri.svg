<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
<rect width="1800" height="1200" fill="#F5F7FB"/>
<defs><marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#1D5AD7"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#087E74"/></marker><marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#7A3CB7"/></marker></defs>
<text x="60" y="77" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" fill="#172B4D" text-anchor="start">Yol parametresi mi, sorgu parametresi mi?</text>
<text x="60" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#4D5D77" text-anchor="start">İki örnekte de FastAPI, URL içindeki değeri Python fonksiyonuna aktarır.</text>
<rect x="60" y="182" width="810" height="852" rx="22" fill="white" stroke="#D8E0ED" stroke-width="2"/>
<rect x="930" y="182" width="810" height="852" rx="22" fill="white" stroke="#D8E0ED" stroke-width="2"/>
<rect x="60" y="182" width="810" height="98" rx="22" fill="#EAF0FE" stroke="#C7D7F9" stroke-width="2"/>
<rect x="930" y="182" width="810" height="98" rx="22" fill="#F2EBFA" stroke="#DAC9EB" stroke-width="2"/>
<text x="95" y="243" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#1D5AD7" text-anchor="start">Yol parametresi: hangi kitap?</text>
<text x="965" y="243" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" fill="#7A3CB7" text-anchor="start">Sorgu parametresi: hangi arama?</text>
<text x="95" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#4D5D77" text-anchor="start">İstemcinin gönderdiği istek</text>
<text x="965" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#4D5D77" text-anchor="start">İstemcinin gönderdiği istek</text>
<rect x="95" y="356" width="740" height="82" rx="12" fill="#F3F6FB" stroke="#D8E0ED" stroke-width="2"/>
<rect x="965" y="356" width="740" height="82" rx="12" fill="#F3F6FB" stroke="#D8E0ED" stroke-width="2"/>
<text x="122" y="409" font-family="Consolas, monospace" font-size="30" font-weight="400" fill="#1D5AD7" text-anchor="start">GET /book/42</text>
<text x="992" y="409" font-family="Consolas, monospace" font-size="30" font-weight="400" fill="#7A3CB7" text-anchor="start">GET /book?search=API</text>
<line x1="465" y1="460" x2="465" y2="538" stroke="#1D5AD7" stroke-width="5" marker-end="url(#arrow-blue)"/>
<line x1="1335" y1="460" x2="1335" y2="538" stroke="#7A3CB7" stroke-width="5" marker-end="url(#arrow-purple)"/>
<text x="495" y="509" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" fill="#1D5AD7" text-anchor="start">42 → book_id</text>
<text x="1365" y="509" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" fill="#7A3CB7" text-anchor="start">API → search</text>
<text x="95" y="591" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#4D5D77" text-anchor="start">Sunucuda bu isteği karşılayan kod</text>
<text x="965" y="591" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#4D5D77" text-anchor="start">Sunucuda bu isteği karşılayan kod</text>
<rect x="95" y="617" width="740" height="181" rx="12" fill="#F3F6FB" stroke="#D8E0ED" stroke-width="2"/>
<rect x="965" y="617" width="740" height="181" rx="12" fill="#F3F6FB" stroke="#D8E0ED" stroke-width="2"/>
<text x="117" y="665" font-family="Consolas, monospace" font-size="25" font-weight="400" fill="#172B4D" text-anchor="start">@app.get(&quot;/book/{book_id}&quot;)</text>
<text x="117" y="714" font-family="Consolas, monospace" font-size="25" font-weight="400" fill="#172B4D" text-anchor="start">def get_book(book_id: int):</text>
<text x="117" y="763" font-family="Consolas, monospace" font-size="25" font-weight="400" fill="#172B4D" text-anchor="start">    ...</text>
<text x="987" y="665" font-family="Consolas, monospace" font-size="25" font-weight="400" fill="#172B4D" text-anchor="start">@app.get(&quot;/book&quot;)</text>
<text x="987" y="714" font-family="Consolas, monospace" font-size="25" font-weight="400" fill="#172B4D" text-anchor="start">def get_books(search: str = &quot;&quot;):</text>
<text x="987" y="763" font-family="Consolas, monospace" font-size="25" font-weight="400" fill="#172B4D" text-anchor="start">    ...</text>
<text x="95" y="850" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" fill="#1D5AD7" text-anchor="start">{book_id}, yolun değişen parçasıdır.</text>
<text x="95" y="898" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#4D5D77" text-anchor="start">Aynı ad fonksiyon parametresinde de bulunur.</text>
<text x="95" y="946" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" fill="#172B4D" text-anchor="start">Bu istekte book_id değeri 42 olur.</text>
<text x="965" y="850" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" fill="#7A3CB7" text-anchor="start">search, ? işaretinden sonra gönderilir.</text>
<text x="965" y="898" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#4D5D77" text-anchor="start">Yolda bulunmaz; fonksiyon parametresidir.</text>
<text x="965" y="946" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" fill="#172B4D" text-anchor="start">Bu istekte search değeri &quot;API&quot; olur.</text>
<rect x="60" y="1071" width="1680" height="84" rx="22" fill="white" stroke="#D8E0ED" stroke-width="2"/>
<text x="92" y="1124" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" fill="#172B4D" text-anchor="start">?search=API, @app.get(...) içine yazılmaz. Dekoratör, bu örnekte yalnızca /book yolunu belirtir.</text>
</svg>